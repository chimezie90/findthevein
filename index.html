<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vein Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a2540;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .camera-viewport {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hidden { display: none; }
    .controls {
      display: flex;
      justify-content: center;
      padding: 2rem;
    }
    .capture-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid white;
      background: transparent;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.1s;
    }
    .capture-btn:active {
      transform: scale(0.95);
    }
    .capture-btn-inner {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
      transition: background 0.2s;
    }
    .capture-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .capture-btn.analyzing .capture-btn-inner {
      background: #00e5cc;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status {
      text-align: center;
      padding: 1rem;
      min-height: 3rem;
      font-size: 1rem;
    }
    .disclaimer {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-top: auto;
      line-height: 1.4;
    }
    .disclaimer strong {
      color: #f59e0b;
    }
    .results-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 0.5rem;
      font-size: 0.875rem;
      display: none;
    }
    .results-panel.visible {
      display: block;
    }
    .scene-description {
      color: #7eb8de;
      margin-bottom: 0.75rem;
      font-style: italic;
    }
    .vein-list {
      list-style: none;
    }
    .vein-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .vein-item:last-child {
      border-bottom: none;
    }
    .vein-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00e5cc;
      color: #0a2540;
      font-weight: bold;
      font-size: 0.75rem;
      margin-right: 0.5rem;
    }
    .vein-number.secondary {
      background: #6496ff;
    }
    .vein-name {
      font-weight: 600;
    }
    .vein-desc {
      color: #aaa;
      margin-left: 28px;
      margin-top: 0.25rem;
    }
    .recommendation {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.2);
      color: #00e5cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vein Finder</h1>

    <div class="camera-viewport">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" class="hidden"></canvas>
    </div>

    <div class="results-panel" id="results-panel">
      <div class="scene-description" id="scene-desc"></div>
      <ul class="vein-list" id="vein-list"></ul>
      <div class="recommendation" id="recommendation"></div>
    </div>

    <div class="controls">
      <button id="capture-btn" class="capture-btn" disabled aria-label="Capture and analyze">
        <span class="capture-btn-inner"></span>
      </button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Initializing camera...</div>

    <div class="disclaimer">
      <strong>For informational purposes only.</strong>
      This tool provides visual guidance and is not a substitute for professional medical judgment.
      Always verify vein selection through clinical assessment.
    </div>
  </div>

  <script type="module">
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const status = document.getElementById('status');
    const resultsPanel = document.getElementById('results-panel');
    const sceneDesc = document.getElementById('scene-desc');
    const veinList = document.getElementById('vein-list');
    const recommendationEl = document.getElementById('recommendation');
    const ctx = canvas.getContext('2d');

    let stream = null;
    let isAnalyzing = false;
    let abortController = null;

    // Get API key from localStorage or use default for testing
    const DEFAULT_KEY = 'AIzaSyBLcDn54z_tfZApBrXN3wfAIQ0P-nVP0xI';
    let API_KEY = localStorage.getItem('gemini_key') || DEFAULT_KEY;
    if (!localStorage.getItem('gemini_key')) {
      localStorage.setItem('gemini_key', API_KEY);
    }

    async function startCamera() {
      // Release any existing stream first
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 960 }
          }
        });
        video.srcObject = stream;

        // Wait for metadata to load
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = reject;
        });

        await video.play();

        // Verify dimensions are valid
        if (video.videoWidth === 0 || video.videoHeight === 0) {
          throw new Error('Video dimensions not available');
        }

        captureBtn.disabled = false;
        status.textContent = 'Ready. Tap to scan.';
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          status.textContent = 'Camera access denied. Please allow camera access and refresh.';
        } else if (err.name === 'NotFoundError') {
          status.textContent = 'No camera found. Please connect a camera.';
        } else {
          status.textContent = 'Camera error: ' + err.message;
        }
        console.error('Camera error:', err);
      }
    }

    async function analyze() {
      if (isAnalyzing) return;
      if (!API_KEY) {
        status.textContent = 'No API key. Refresh page to enter key.';
        return;
      }

      // Cancel any previous request
      if (abortController) {
        abortController.abort();
      }
      abortController = new AbortController();

      isAnalyzing = true;

      captureBtn.disabled = true;
      captureBtn.classList.add('analyzing');
      status.textContent = 'Analyzing...';

      // Capture frame
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      // Higher quality image for better vein detection
      const base64 = canvas.toDataURL('image/png').split(',')[1];

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  {
                    inlineData: {
                      mimeType: 'image/png',
                      data: base64
                    }
                  },
                  {
                    text: `You are an expert phlebotomist assistant. Analyze this image for venipuncture sites.

Respond with JSON only:
{
  "scene": "Brief description of what you see (e.g., 'Inner elbow of left arm, palm facing up, good lighting')",
  "veins": [
    {
      "point": [y, x],
      "name": "vein name (e.g., Median Cubital Vein)",
      "description": "Short description - size, visibility, why good/bad for blood draw"
    }
  ],
  "recommendation": "Which numbered vein is best and why (1-2 sentences)"
}

CRITICAL for coordinates:
- "point" is the CENTER of where the needle should go [y, x]
- Use 0-1000 scale normalized to image dimensions
- Y comes first! [y, x] not [x, y]
- Be precise - mark the exact spot on the vein

List veins in order of preference (best first). Include 1-4 veins if visible.`
                  }
                ]
              }],
              generationConfig: {
                temperature: 0.4,
                maxOutputTokens: 2048
              }
            }),
            signal: abortController.signal
          }
        );

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error?.message || `API error: ${response.status}`);
        }

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

        // Extract JSON from response (handle markdown code blocks)
        let jsonText = text;
        const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (codeBlockMatch) {
          jsonText = codeBlockMatch[1];
        }
        const jsonMatch = jsonText.match(/\{[\s\S]*\}/);

        if (jsonMatch) {
          const result = JSON.parse(jsonMatch[0]);
          // Validate vein data - now using "point" instead of "box"
          const veins = (result.veins || []).filter(v =>
            typeof v.name === 'string' &&
            Array.isArray(v.point) && v.point.length === 2 &&
            v.point.every(n => typeof n === 'number' && n >= 0 && n <= 1000)
          );

          if (veins.length > 0) {
            drawAnnotations(veins);
            showResults(result.scene, veins, result.recommendation);
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            status.textContent = `Found ${veins.length} vein${veins.length > 1 ? 's' : ''}. Tap to scan again.`;
          } else {
            status.textContent = result.recommendation || 'No veins detected. Try better lighting.';
          }
        } else {
          console.log('Raw response:', text);
          status.textContent = 'Could not parse response. Try again.';
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          return; // Request was cancelled, do nothing
        }
        console.error('Analysis error:', err);
        status.textContent = 'Analysis failed. Please try again.';
      } finally {
        isAnalyzing = false;
        captureBtn.disabled = false;
        captureBtn.classList.remove('analyzing');
        abortController = null;
      }
    }

    function drawAnnotations(veins) {
      veins.forEach((vein, i) => {
        const [y, x] = vein.point || [0, 0];

        // Convert from 0-1000 normalized to canvas pixels
        const cx = (x / 1000) * canvas.width;
        const cy = (y / 1000) * canvas.height;

        const isPrimary = i === 0; // First vein is primary (best)
        const color = isPrimary ? '#00e5cc' : '#6496ff';
        const radius = isPrimary ? 16 : 12;

        // Draw glow effect
        ctx.shadowColor = color;
        ctx.shadowBlur = isPrimary ? 15 : 8;

        // Draw outer ring
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw filled circle
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        // Reset shadow
        ctx.shadowBlur = 0;

        // Draw number
        ctx.fillStyle = '#0a2540';
        ctx.font = `bold ${isPrimary ? 14 : 12}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), cx, cy);
      });
    }

    function showResults(scene, veins, recommendation) {
      // Scene description
      sceneDesc.textContent = scene || '';

      // Vein list
      veinList.innerHTML = veins.map((vein, i) => `
        <li class="vein-item">
          <span class="vein-number ${i > 0 ? 'secondary' : ''}">${i + 1}</span>
          <span class="vein-name">${vein.name}</span>
          <div class="vein-desc">${vein.description || ''}</div>
        </li>
      `).join('');

      // Recommendation
      recommendationEl.textContent = recommendation || '';

      resultsPanel.classList.add('visible');
    }

    function reset() {
      video.classList.remove('hidden');
      canvas.classList.add('hidden');
      resultsPanel.classList.remove('visible');
      status.textContent = 'Ready. Tap to scan.';
    }

    captureBtn.addEventListener('click', () => {
      if (isAnalyzing) return; // Prevent double-clicks

      if (canvas.classList.contains('hidden')) {
        analyze();
      } else {
        reset();
      }
    });

    // Clean up camera stream on page hide/unload
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
      }
    });

    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    // Start camera on load
    startCamera();
  </script>
</body>
</html>
